{{define "content"}}
<h2>Фильтры</h2>
<form method="GET" action="/">
    <label>Категория:</label>
    <select name="category">
        <option value="0">Все категории</option>
        {{range .Categories}}
            <option value="{{.Id}}">{{.Name}}</option>
        {{end}}
    </select>

    <label>С даты:</label>
    <input type="date" name="date_from" value="{{.DateFrom}}">

    <label>По дату:</label>
    <input type="date" name="date_to" value="{{.DateTo}}">

    <button type="submit">Применить</button>
    <a href="/">Сбросить</a>
</form>

<h2>Список моих расходов</h2>

<table>
    <thead>
        <tr>
            <th>Сумма (руб.)</th>
            <th>Категория</th>
            <th>Описание</th>
            <th>Дата</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {{range .Expenses}}
        <tr>
            <td><strong>{{.Amount}}</strong></td>
            <td>{{.CategoryName}}</td>
            <td>{{.Description}}</td>
            <td>{{.Date}}</td>
            <td>
                <a href="/edit?id={{.Id}}">Изменить</a>
                <a href="/delete?id={{.Id}}" onclick="return confirm('Точно удалить?')">Удалить</a>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="5" style="text-align: center; color: gray;">Трат пока нет или ничего не найдено!</td>
        </tr>
        {{end}}
    </tbody>
</table>

<h2>Добавить новый расход</h2>

<form action="/" method="POST">
    <label>Сумма:</label>
    <input type="number" name="amount" required placeholder="Например, 500">
    
    <label>Категория:</label>
    <select name="category_id" required>
        <option value="">Выберите категорию...</option>
        {{range .Categories}}
            <option value="{{.Id}}">{{.Name}}</option>
        {{end}}
    </select>

    <label>Описание:</label>
    <input type="text" name="description" required placeholder="Например, Продукты">
    
    <label>Дата:</label>
    <input type="date" name="date" required>
    
    <button type="submit">Сохранить трату</button>
</form>
{{end}}
